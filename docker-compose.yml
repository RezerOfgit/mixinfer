services:
  mixinfer-gateway:
    build:
      context: ./mixinfer-gateway
      dockerfile: Dockerfile
    image: mixinfer/gateway:0.1.0
    container_name: mixinfer-gateway
    ports:
      - "8080:8080"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - MIXINFER_USAGE_FILE=/app/logs/usage.log
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

