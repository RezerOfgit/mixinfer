services:
  mixinfer-gateway:
    build:
      context: ./mixinfer-gateway
      dockerfile: Dockerfile
    image: mixinfer/gateway:0.4.0
    container_name: mixinfer-gateway
    ports:
      - "8080:8080"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - MIXINFER_ADMIN_KEY=${MIXINFER_ADMIN_KEY}
      - MIXINFER_SQLITE_PATH=/app/logs/mixinfer.db
    volumes:
      - mixinfer-data:/app/data
    restart: unless-stopped

volumes:
  mixinfer-data: