server:
  port: 8080

spring:
  application:
    name: mixinfer-gateway

mixinfer:
  api-keys:
    - key: sk-mixinfer-dev
      name: default
  providers:
    - name: openai-compatible
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      models:
        - gpt-4o-mini
  routes:
    - model: gpt-4o-mini
      provider: openai-compatible

logging:
  level:
    com.mixinfer: DEBUG