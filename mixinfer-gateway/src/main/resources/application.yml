server:
  port: 8080

spring:
  application:
    name: mixinfer-gateway

mixinfer:
  api-keys:
    - key: sk-mixinfer-dev
      name: default
  providers:
    - name: openai-compatible
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      models:
        - deepseek-flash
  routes:
    - model: deepseek-flash
      targets:
        - provider: openai-compatible
  usage:
    file: ${MIXINFER_USAGE_FILE:logs/usage.log}

  # To exercise failover locally, add a second (unreachable) provider
  # and a second route target:
  #
  # providers:
  #   - name: broken
  #     base-url: http://localhost:1
  #     api-key: dummy
  # routes:
  #   - model: deepseek-flash
  #     targets:
  #       - provider: broken
  #       - provider: openai-compatible