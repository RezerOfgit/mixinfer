server:
  port: 8080

spring:
  application:
    name: mixinfer-gateway

mixinfer:
  api-keys:
    - key: sk-mixinfer-dev
      name: default
  providers:
    - name: openai-compatible
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      models:
        - deepseek-flash
  routes:
    # New multi-target form (V0.3+). Declaration order = priority.
    - model: deepseek-flash
      targets:
        - provider: openai-compatible

    # Backward-compatible single-provider form (V0.1-V0.2):
    # - model: deepseek-flash
    #   provider: openai-compatible
  usage:
    file: ${MIXINFER_USAGE_FILE:logs/usage.log}