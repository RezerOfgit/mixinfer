server:
  port: 8080

spring:
  application:
    name: mixinfer-gateway

mixinfer:
  api-keys:
    - key: sk-mixinfer-dev
      name: default
  providers:
    - name: openai-compatible
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      models:
        - deepseek-flash
  routes:
    - model:  deepseek-flash
      provider: openai-compatible

logging:
  level:
    com.mixinfer: DEBUG